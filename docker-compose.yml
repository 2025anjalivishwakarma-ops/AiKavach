
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aikavach-backend
    env_file:
      - .env
    environment:
      PORT: 3001
      NODE_ENV: development
      DATA_PATH: /app/data/aikavach-data.json
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - aikavach-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aikavach-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  aikavach-data:
