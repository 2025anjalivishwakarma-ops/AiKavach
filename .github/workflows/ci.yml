name: AiKavach CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Verify AiKavach
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Backend Docker Image
        run: docker build -f Dockerfile.backend -t aikavach-backend .

      - name: Build Frontend Docker Image
        run: docker build -f Dockerfile.frontend -t aikavach-frontend .